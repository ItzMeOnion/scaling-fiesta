name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle 8.10
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-knife
          path: build/libs/*.jar
