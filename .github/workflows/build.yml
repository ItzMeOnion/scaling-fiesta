name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-knife
          path: build/libs/*.jar
